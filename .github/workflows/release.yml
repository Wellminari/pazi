# Gera o instalador do Pazi para Windows.
# Aba Actions > "Gerar instalador" > Run workflow:
#   - "publicar" desmarcado: só gera o .exe para baixar (teste)
#   - "publicar" marcado: gera e publica em Releases com a versão do package.json
#     (os apps instalados nos clientes baixam a atualização sozinhos)
# Também publica ao criar uma tag v0.1.2, v0.1.3...

name: Gerar instalador

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar como nova versão (atualiza os apps instalados)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ícones do app (cantos arredondados)
        shell: bash
        run: |
          pip install pillow
          # Pazi: usa build/pazi.png do repositório; se não existir, baixa a logo do painel
          if [ ! -f build/pazi.png ]; then
            curl -fsSL -o build/pazi.png https://painel.pazi.app/pwa-icon-v2.png
          fi
          # Mesmo arredondamento do ícone do Pazi Atende (~12,5% do lado)
          python build/make-icon.py build/pazi.png build/icon.ico 0.125
          # Pazi Atende: usa build/atende.png (já vem arredondado, então raio 0)
          if [ -f build/atende.png ]; then
            python build/make-icon.py build/atende.png build/atende.ico 0
          else
            cp build/icon.ico build/atende.ico
          fi

      - name: Instalar dependências
        run: npm install

      - name: Verificar código
        run: npm run check

      - name: Gerar instalador (sem publicar)
        if: github.event_name == 'workflow_dispatch' && !inputs.publicar
        run: npm run dist

      - name: Gerar e publicar versão
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar instalador para download
        uses: actions/upload-artifact@v4
        with:
          name: Pazi-Setup
          path: dist/*.exe
