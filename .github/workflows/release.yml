# Gera o instalador do Pazi para Windows.
# Aba Actions > "Gerar instalador" > Run workflow:
#   - "publicar" desmarcado: só gera o .exe para baixar (teste)
#   - "publicar" marcado: gera e publica em Releases com a versão do package.json
#     (os apps instalados nos clientes baixam a atualização sozinhos)
# Também publica ao criar uma tag v0.1.2, v0.1.3...

name: Gerar instalador

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar como nova versão (atualiza os apps instalados)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ícones do app (cantos arredondados)
        shell: bash
        run: |
          pip install pillow
          # Pazi: usa build/pazi.png do repositório; se não existir, baixa a logo do painel
          if [ ! -f build/pazi.png ]; then
            curl -fsSL -o build/pazi.png https://painel.pazi.app/pwa-icon-v2.png
          fi
          # Ícone oficial do Pazi já vem arredondado: usa como está (raio 0)
          python build/make-icon.py build/pazi.png build/icon.ico 0
          # Pazi Atende: usa build/atende.png (já vem arredondado, então raio 0)
          if [ -f build/atende.png ]; then
            python build/make-icon.py build/atende.png build/atende.ico 0
          else
            cp build/icon.ico build/atende.ico
          fi

      - name: Instalar dependências
        run: npm install

      - name: Verificar código
        run: npm run check

      - name: Gerar instalador
        run: npm run dist

      - name: Versão do package.json
        id: versao
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publicar versão (atualiza os apps instalados)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: Pazi ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Guardar instalador para download
        uses: actions/upload-artifact@v4
        with:
          name: Pazi-Setup
          path: dist/*.exe
